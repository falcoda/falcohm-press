why_us: 'L''ASBL est domiciliée à Genappe et Gazmatek se déroule sur le territoire
  provincial : la condition territoriale, celle qui élimine le plus de candidats,
  est acquise d''office. Le règlement cite nommément les « festivals » et les « concerts
  » parmi les activités à réelle dimension culturelle, et réserve l''aide aux ASBL
  et associations de fait, à l''exclusion des sociétés commerciales : Falc''ohm System
  est exactement le profil ciblé. Avec plus de 10.000 festivaliers, Gazmatek relève
  de la Catégorie 1 (grande ampleur), le plafond le plus élevé. Les critères d''analyse
  récompensent précisément nos points forts : diversité et jeunesse des publics, promotion
  d''artistes du Brabant wallon, tarification accessible, liens avec le tissu associatif
  local, et développement durable en critère bonus.

  '
ask:
  type:
  - financial
  - loan
  - services
  detail: 'QUATRE dispositifs, dans l''ordre du plus simple au plus lourd. (1) ASSURANCE
    VOLONTARIAT, gratuite : demande d''agrément « au plus tard 6 semaines avant le
    début de l''activité », décision du Collège sous 6 semaines, jusqu''à 200 journées
    de volontariat par an. À demander pour chaque date, à commencer par Halloween
    Shadow du 31/10 (dépôt avant le 19/09). (2) CENTRE DE PRÊT : cotisation annuelle
    (23 € liste A, matériel léger ; 284 € liste B, matériel lourd), formulaire en
    ligne, chapiteaux jusqu''à 15x30 m et podiums confirmés, le reste à vérifier au
    catalogue. (3) « Aide à l''organisation d''événements culturels », Catégorie 1
    (public > 1.000 ET budget > 50.000 € ET caractère supracommunal) : subvention
    supérieure à 1.500 € avec un plafond de 10.000 €. Une seule demande par an, au
    minimum 2 mois avant le début de l''événement, par courriel à culture.loisirs.citoyennete@brabantwallon.be
    avec le formulaire PDF (refait en 2026, à relire) et ses annexes ; examen par
    ordre d''arrivée, donc dépôt début janvier 2027. (4) « Place aux jeunes » : chaque
    euro investi par la COMMUNE est doublé par le Brabant wallon, uniquement pour
    des cachets artistiques et leurs besoins en logistique et technique, minimum 1.000
    €, plafond 5.000 €, public 10-20 ans, « deejaying » cité parmi les disciplines
    ; porté par la commune, à monter avec Genappe (mail à Michaël Rouffiange parti
    le 04/09). Place aux Artistes (été) passe aussi par la commune.'
  realistic_value_eur: 8000
values:
- Accès à la culture sur le territoire
- Émergence des artistes du Brabant wallon
- Identité culturelle provinciale
- Cohésion et tissu social
- Développement durable
- Publics jeunes et diversité des publics
