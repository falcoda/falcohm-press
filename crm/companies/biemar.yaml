  - services
  detail: 'Compte pro avec remise sur le multiplex bouleau (15/18/21 mm) récurrent,
    mise à disposition des chutes et fins de série de panneaux, et prestation de découpe
    CNC des flancs d''enceintes à tarif partenaire ou offerte. Contrepartie : visibilité
    sur le sound system et sur les 10-15 événements Gazmatek/an (+10 000 festivaliers,
    27 000 abonnés).'
  realistic_value_eur: 5000
