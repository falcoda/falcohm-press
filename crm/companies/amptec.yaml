why_us: 'Amptec est belge, à environ 1h30 de Genappe, et surtout : c''est la seule
  cible du module dont les DEUX dirigeants publient leur e-mail nominatif direct sur
  le site. Bart Willems (CEO) et Charlotte Willems (co-CEO), entreprise familiale,
  décision prise par le patron, aucun comité de sponsoring à franchir. C''est structurellement
  la cible la plus « adressable » de toute la liste. Au-delà du sponsoring, ils couvrent
  trois besoins concrets et récurrents de Falc''ohm : l''amplification (via les marques
  distribuées), la confection de câblage sur mesure pour les racks et les façades,
  et un centre de réparation/pièces détachées pour l''entretien du parc.'
ask:
  type:
  - discount
  - services
  - material
  - consumables
  detail: 'Un soutien materiel sur deux postes que leur metier couvre reellement :

    (1) CABLAGE CONFECTIONNE SUR MESURE : cables HP, multipaires, panneaux Speakon
    pour les racks et les facades. Ils produisent leur propre cablage, c''est leur
    savoir-faire, pas une revente ;

    (2) MAINTENANCE : acces au centre de reparation et aux pieces detachees a conditions
    partenaire. Pour un systeme utilise chaque week-end, c''est le poste qui coute
    le plus cher sur dix ans.

    Ne pas demander d''amplification ni de processing : poste couvert par ADmark.
    Contrepartie : marquage sur les racks, visibilite sur nos dates et aupres des
    27 000 abonnes.'
  realistic_value_eur: 5000
  public: "- du câblage confectionné sur mesure : câbles haut-parleurs, multipaires\
    \ et panneaux Speakon\n  pour nos racks et nos façades, que vous produisez vous-mêmes\
    \ ;\n- un accès à votre centre de réparation et aux pièces détachées à conditions\
    \ partenaire. Sur\n  dix ans, c'est le poste qui pèse le plus lourd pour un système\
    \ utilisé chaque week-end."
