  detail: 'Compte professionnel ou OEM sur les transducteurs. REFERENCES DESORMAIS
    CONNUES (data/bom.yaml, premiere serie) : 12NDL88 x12, DCX464 x4, FB464 x4. C''est
    un argument bien plus fort que la demande generique du 2026-09-04 : nous ne demandons
    pas a decouvrir leur gamme, elle est deja dans nos plans. A ressortir a la relance
    du 2026-09-14. Ajouter les kits de reconing pour la maintenance.'
  realistic_value_eur: 18000
