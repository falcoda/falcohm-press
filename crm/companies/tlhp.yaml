profile:
  activity: Distributeur français de composants de haut-parleurs, entreprise familiale
    (René Denoual et ses trois fils) créée en 1992, 5 personnes, 80 000 clients, 14
    000 références dont 7 000 à 7 500 en stock, centre logistique de 1 800 m² à Bourgbarré
    près de Rennes depuis 2022. Chiffre d'affaires 2,8 M EUR en 2021 (3,5 M attendus
    en 2022). Distributeur France de B&C Speakers, premier revendeur RCF de France,
    distributeur officiel de PHL Audio et d'Oberton. Fabrique aussi des kits de sound
    system à pavillons (APOLLON). Le site refuse les robots (HTTP 403).
  products:
  - Transducteurs de toutes les grandes marques, dont B&C Speakers et RCF (nos deux
    marques arrêtées), 18Sound, FaitalPRO, Beyma, PHL, Oberton, Celestion, Lavoce,
    BMS, Sica
  - Composants de filtre passif (condensateurs, selfs, résistances, Mundorf)
  - Connectique Neutrik (Speakon, XLR, powerCon) et câble
  - Quincaillerie de caisson (coins, poignées, grilles, évents, vis, mousse, roulettes),
    flightcase et rack
  - Kits de reconing et membranes (274 kits B&C, 88 kits RCF)
  - Kits de sound system APOLLON (4 ou 5 voies, pavillons, extérieur)
  size:
    employees: '5'
    revenue: 2,8 M EUR (2021)
  identifiers:
    vat: FR SIREN 385 258 470
    linkedin: ''
why_us: 'Le seul distributeur du module qui stocke à la fois nos deux marques de transducteurs,
  leurs kits de reconing, la connectique Neutrik, les composants de filtre et la quincaillerie
  de caisson : un seul compte couvre toute la nomenclature, sans le décalage de catalogue
  qui a tué le poste transducteurs chez SoundImports. Entreprise familiale de cinq
  personnes, francophone, où le fondateur est directeur général et ses fils tiennent
  les achats : la décision est courte. Et ils fabriquent eux-mêmes des kits de sound
  system à pavillons, testés en salle associative : ils comprennent ce que nous construisons,
  et une construction documentée a sa place dans leur galerie « Réalisations ».'
ask:
  type:
  - discount
  - consumables
  - material
  detail: 'DEJA CLIENTS PROFESSIONNELS (compte falcohm6tm@outlook.com, Corentin 2026-09-11)
    : le compte pro existe, la demande est un PARTENARIAT. Soutien materiel sur quatre
    postes enonces en categories : haut-parleurs de grave et moteurs de compression
    ; connectique et cablage ; quincaillerie de caisson ; kits de reconing. Deux formes,
    sans en imposer une : conditions preferentielles au-dela du tarif pro, ou dotation
    partielle sur la premiere serie. La recherche du 2026-09-09 dit qu''ils vendent
    avec conseil plutot qu''ils ne donnent : la premiere forme est la plus probable.
    PAS DE COMPOSANTS DE FILTRE PASSIF (aucun modele n''en utilise hors le FB464,
    commande avec le DCX464). NE PAS demander d''amplification ni de DSP (ADmark).
    Ne pas reciter leur catalogue ni nos references. Contrepartie : documentation
    de nos constructions pour leur galerie « Realisations » et leur forum, marquage
    partenaire sur les caissons, mention des composants fournis par TLHP sur nos supports.
    La « commande administration » est reservee aux administrations publiques francaises
    : hors champ, ne pas s''en reclamer.'
  public: "- des haut-parleurs de grave et des moteurs de compression, le poste le\
    \ plus lourd, et un\n  consommable puisqu'ils se remplacent et se recônent ;\n\
    - de la connectique et du câblage ;\n- de la quincaillerie de caisson ;\n- des\
    \ kits de reconing pour la maintenance."
