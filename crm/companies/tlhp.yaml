notes: 'SITE EN 403 : toutes les pages du site TLHP ont été lues en extraits de moteur,
  jamais ouvertes. Avant de citer un chiffre ou une condition à TLHP, l''ouvrir dans
  un navigateur.

  COMMANDE ADMINISTRATION : réservée aux administrations publiques françaises (mandat
  DGFiP, paiement à 30 jours, bon de commande cacheté). Une ASBL belge n''y entre
  pas. L''argument noté le 14/07 (« ils savent facturer une entité non commerciale
  ») tombe.

  COMPTE PRO : activation sur demande, « special prices per quantity ». CGV du 05/06/2026
  : TVA sur le bon de commande, puis hors TVA sur facture après validation du numéro
  intracommunautaire. À confirmer avec le statut TVA de l''ASBL avant de s''en prévaloir.

  LIVRAISON BELGIQUE : oui, frais selon transporteur, simulateur dans le panier, paiement
  en quatre fois ouvert à la Belgique. Montant des frais : non trouvé.

  NE PAS UTILISER : contact@toutlehautparleur.com (annuaire tiers, non lu sur une
  page), le 02 23 27 65 99 (fiche communale de Vern-sur-Seiche, ancien site, probablement
  périmée), le 0892 (surtaxé). Ancien site : 10 rue du Passavent, 35770 Vern-sur-Seiche,
  encore dans les annuaires B&C et de la commune.

  PHL AUDIO (fabricant dont TLHP est le distributeur) : nouvelle société depuis 2023,
  président Yoann Flavignard, contact@phlaudio.com sans nom, pas de vente directe.
  Hors nomenclature : ne pas écrire.

  ADRESSE : info@tlhp.fr, generique, retenue par exception le 2026-09-12 (voir next_action).
  COMPTE PRO : l''ASBL l''a DEJA (compte falcohm6tm@outlook.com, Corentin 2026-09-11).
  Les lignes ci-dessus sur l''activation du compte pro datent de la recherche du 2026-09-09
  et ne sont plus une etape a faire.'
