  resume: 'PRESTATION DU 2026-09-06 : bien passee. NATURE EXACTE, precisee par Corentin
    le 2026-09-07 : Falc''ohm a REALISE UNE PUBLICITE POUR BASE. C''est une prestation
    commerciale facturee, PAS une collaboration ni un sponsoring. Aucun accord de
    partenariat n''existe a ce jour. Le logo Base appose sur le materiel (facade d''un
    top, flanc d''un caisson, deux subs du mur de 21 pouces) fait partie du DECOR
    DU TOURNAGE : c''est un habillage de production, pas un marquage partenaire. Trois
    photos dans assets/partners/base-2026/. NE PAS presenter ces images comme la preuve
    d''un partenariat, ni a Base, ni a une autre cible : ce serait suggerer une caution
    que Base n''a jamais donnee. CE QU''ELLES PROUVENT REELLEMENT, et c''est deja
    beaucoup : une marque telecom nationale a choisi ce materiel pour tourner sa campagne,
    et il tient a l''image. A CONFIRMER : le nom du decideur budget cote Base ou Telenet
    a-t-il ete obtenu ?'
