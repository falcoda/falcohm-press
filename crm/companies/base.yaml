scoring:
  business_fit: 7
  partnership_probability: 7
  impact_if_successful: 7
  rationale: 'REVU LE 2026-09-07, APRES CORRECTION DE CORENTIN. La relation avec Base
    est COMMERCIALE : Falc''ohm leur facture des prestations, dont une publicite tournee
    le 2026-09-06. Il n''y a ni collaboration ni sponsoring a ce jour, et le logo
    vu sur le materiel releve du decor de tournage. business_fit 7 : ce n''est pas
    de la visibilite recherchee, c''est un client qui paie, donc un revenu recurrent,
    ce qui vaut mieux qu''une faveur. partnership_probability 7, ramene de 8 : ils
    nous connaissent, nous paient et ont vu le materiel a l''oeuvre, ce qui est le
    meilleur predicteur possible ; mais passer de fournisseur a partenaire est une
    demande NEUVE qu''ils n''ont jamais examinee, et le decideur budget reste inconnu.
    Ne pas confondre une relation qui marche avec un oui acquis. impact_if_successful
    7 : ordre de grandeur 5 000 EUR, et surtout une reference telecom nationale qui
    credibilise tout le reste du fichier.'
