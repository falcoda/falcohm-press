  rationale: 'REVU LE 2026-09-09 après recherche approfondie. Fit réel mais étroit
    (6) : le dispositif ne finance pas l''événement, il rembourse une part du cachet
    d''artistes labélisés, et notre programmation est majoritairement française ou
    en DJ set ; seuls les lives originaux de résidents wallons et bruxellois labélisés
    ouvrent un droit. Probabilité correcte (6) : la labélisation est une procédure
    administrative ouverte aux ASBL sans reconnaissance, instruite par un gestionnaire,
    pas par un jury. Impact faible (4) : 250 à 370 EUR par concert éligible, plafonnés
    à 50 % du cachet, deux représentations par production, sur peut-être quatre à
    six concerts par an. Le vrai bénéfice est indirect : le statut de diffuseur labélisé
    compte pour le dossier du Service des Musiques et permet à nos résidents de décrocher
    leur propre label.'
