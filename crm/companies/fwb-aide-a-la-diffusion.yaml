notes: 'LE MÉCANISME, EN UNE PHRASE : un diffuseur labélisé qui programme une production
  du Catalogue Diffusion reçoit, par représentation, un forfait selon le nombre d''artistes
  (250 ou 370 EUR en musiques électroniques), plafonné à 50 % du cachet, deux fois
  maximum par production, versé sous quatre semaines après le justificatif de prestation.

  CONDITIONS PAR DATE (démarche 4823) : « La représentation ou le concert est l''objet
  principal d''une manifestation ouverte au grand public » ; exclus : auto-programmations,
  dates de création ou premier concert du groupe, manifestations caritatives ; « Le
  droit d''entrée moyen à la représentation doit être de 4 € minimum » ; lieu en FWB,
  « en dehors du lieu de création » ; demande « au plus tard 6 semaines avant la manifestation,
  et dans tous les cas avant le 30 septembre » ; copie « au Service Culture provincial
  ou CoCoF » ; « Toute représentation d''une durée inférieure à 45 minutes donnera
  lieu à une subvention réduite de moitié ».

  QUELS ARTISTES : uniquement les productions labélisées. Label d''un groupe en musiques
  actuelles (démarche 4311) : établi en Wallonie ou à Bruxelles, « programmé au moins
  3 fois » ou « 3 dates contractuellement planifiées » chez des opérateurs soutenus
  ou des diffuseurs labélisés, « enregistrement sonore professionnel (tel qu''un EP
  ou LP) ou une captation », « répertoire comprenant au moins 50 % de compositions
  originales », « 45 minutes minimum », décision « dans les 5 semaines ». Un DJ set
  de titres tiers ne remplit pas le critère des compositions originales ; un live
  d''un producteur local le remplit. Les collectifs français sont exclus par l''art.
  11 § 2 du décret.

  QUOTAS : sans objet avant « trois années consécutives de subventions à la diffusion
  tout public ou scolaire pour au moins 3.000 euros chaque année ». Et les nouveaux
  quotas des « autres types de diffuseurs labélisés sont traités en dernier lieu ».

  NON-CUMUL : « Le soutien Extras ne peut être demandé si soutien Art&Vie est déjà
  introduit pour une même prestation » (Court-Circuit). Cumul avec les aides aux projets
  du Service des Musiques : rien d''écrit dans un sens ni dans l''autre, à demander.

  BRABANT WALLON : co-finance déjà (« En Province du Brabant wallon, ce fonctionnement
  est déjà en place depuis plusieurs années », Court-Circuit) ; la page Culture de
  la Province cite « les Tournées Art et Vie ». Barème provincial à confirmer, le
  PDF des partenaires provinciaux n''a pas pu être lu.

  PAGES NON OUVERTES le 2026-09-09 : Partenaires_provinciaux.pdf, Bilan-Diffusion-2025-web.pdf,
  tara.cfwb.be (« Loading... » sans navigateur).'
