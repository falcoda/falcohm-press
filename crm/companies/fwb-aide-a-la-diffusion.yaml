why_us: 'Le doute du 14/07 est levé : les musiques électroniques sont au Catalogue
  Diffusion (43 productions labélisées), et une ASBL sans contrat-programme peut demander
  sa labélisation de diffuseur si elle diffuse « de manière régulière depuis au moins
  2 ans », avec statuts, comptes de deux exercices et un projet à plus de 50 % de
  spectacles. Depuis le 1er janvier 2025 c''est l''organisateur qui encaisse. Ce n''est
  pas un financement de l''événement : c''est un remboursement partiel du cachet des
  artistes wallons et bruxellois labélisés que nous programmons, et une place dans
  un réseau que le Service des Musiques regarde (« intégration dans les réseaux professionnels
  »). Le second bénéfice vaut plus que le premier.'
ask:
  type:
  - financial
  detail: '(1) Trois questions écrites à la Direction de la Diffusion avant toute
    démarche : une structure itinérante sans salle propre peut-elle être labélisée,
    et que déclare-t-elle comme infrastructure ; des artistes résidents membres de
    l''ASBL sont-ils une « auto-programmation » (exclue) ; le Brabant wallon contribue-t-il
    aux aides ponctuelles hors quota. (2) Si oui, labélisation sur Tara : statuts,
    comptes et bilans 2024 et 2025, programmations passées, projet 2027 avec la part
    de spectacles. (3) Ensuite, une demande par date, au plus tard 6 semaines avant,
    pour chaque live d''un artiste labélisé. Aucun quota avant trois années consécutives
    d''aides. Aucun dossier de partenariat : c''est une procédure.'
