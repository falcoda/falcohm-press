profile:
  activity: 'Direction de l''Administration générale de la Culture (Service général
    de la Création artistique) qui verse une subvention PAR REPRÉSENTATION à un diffuseur
    labélisé qui programme une production inscrite au Catalogue Diffusion. Décret
    du 16 mai 2024, en vigueur le 1er janvier 2025 : la subvention est versée à l''organisateur,
    qui paie le cachet complet à l''artiste. Gestion sur la plateforme Tara (tara.cfwb.be).
    Boulevard Léopold II, 44, 1080 Bruxelles.'
  products:
  - Labélisation des diffuseurs, à tout moment de l'année, sur Tara
  - Subvention à la diffusion tout public par représentation, forfait par artiste
    (250 ou 370 EUR en musiques électroniques), plafonnée à 50 % du cachet, deux représentations
    par production
  - Quotas de diffusion (3 000 à 50 000 EUR par an), réservés après trois années consécutives
    d'aides d'au moins 3 000 EUR
  - Catalogue Diffusion, 980 productions en musique dont 43 en « Musiques électroniques
    » au 2026-09-09
