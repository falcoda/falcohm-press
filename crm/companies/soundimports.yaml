why_us: 'C''est la cible la plus stratégique de tout le module audio. Un seul compte
  chez SoundImports couvre TOUTE la nomenclature d''un caisson : les transducteurs
  (ils référencent les grandes marques de sono), les modules d''amplification et DSP,
  les composants de filtre, la connectique et même les outils de mesure. Là où un
  fabricant italien ne peut offrir qu''une remise sur sa propre gamme, eux peuvent
  porter le prix de tout le projet. Ils sont aux Pays-Bas (livraison rapide, même
  fuseau, même TVA intracommunautaire), la structure est jeune (2015) et son fondateur
  Martijn Ouwerkerk dirige toujours l''entreprise, pas de comité. Et ils ont déjà
  le réflexe : ils organisent chaque année une DIY Competition, entretiennent une
  galerie de projets communautaires et soutiennent les créateurs de contenu en produits
  et en support technique. Une ASBL belge qui construit des subs à pavillon et documente
  le build est littéralement leur contenu rêvé.'
ask:
  type:
  - discount
  - material
  - consumables
  - visibility
  detail: 'Un compte professionnel ou revendeur a conditions permanentes, et une dotation
    partielle en composants pour la premiere serie, sur les postes qu''ils distribuent
    :

    (1) TRANSDUCTEURS : haut-parleurs de grave, moteurs de compression, mediums. Le
    poste le plus lourd de la nomenclature, et un consommable puisqu''il se remplace
    et se recone ;

    (2) COMPOSANTS DE FILTRE PASSIF, cablage, connectique et bornes ;

    (3) OUTILS DE MESURE, pour caler le systeme nous-memes plutot que de le sous-traiter.

    Ne pas demander de modules d''ampli ni de DSP : poste couvert par ADmark. Contrepartie
    : documentation complete du build (photos, mesures, making-of) exploitable par
    eux en contenu et en galerie DIY, marquage sur les facades, visibilite sur 10-15
    evenements.'
  realistic_value_eur: 15000
  public: "- transducers first of all: LF drivers, compression drivers and mid-range\
    \ units. They are the\n  heaviest item in the bill of materials, and a consumable,\
    \ since they get replaced and reconed;\n- passive crossover components, wiring,\
    \ connectors and terminals;\n- measurement tools, so that we can align the system\
    \ ourselves rather than subcontract it."
