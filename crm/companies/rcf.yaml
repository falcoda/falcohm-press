  business_fit: 9
  partnership_probability: 4
  impact_if_successful: 8
  rationale: 'Fit moyen sur le produit : RCF vend surtout des systèmes finis, et ses
    transducteurs bruts sont réservés à un canal OEM peu ouvert aux petits volumes,
    ce n''est pas le fournisseur naturel d''un constructeur de caissons DIY. Mais
    c''est le meilleur profil « sponsor » de toute la catégorie, avec un antécédent
    spectaculaire (RCF Arena). D''où une probabilité honorable malgré la taille du
    groupe, à condition d''attaquer par la porte marketing/sponsoring et non par la
    porte commerciale.


    REVU LE 2026-09-07 : business_fit 6 -> 9. Ce n''est plus une hypothese. La nomenclature
    de la premiere serie retient le RCF 21LF-N451, six unites (data/bom.yaml). Nous
    sommes donc deja leur client sur le poste le plus lourd du caisson, le 21 pouces.
    L''amplification RCF ne nous interesse pas, ADmark couvre le poste, mais leurs
    transducteurs OEM sont dans nos plans. impact 7 -> 8 : un 21 pouces est cher et
    il se remplace. La probabilite reste a 4, faute de tout contact humain : leur
    seule adresse publique est celle du DPO, a laquelle il ne faut surtout pas ecrire.'
