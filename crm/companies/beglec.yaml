why_us: 'Beglec est à 30 minutes de Genappe, c''est la cible géographiquement la plus
  proche du module. Et son portefeuille de marques maison couvre plusieurs besoins
  d''un coup : Synq pour l''amplification, Hilec pour le câblage des façades et des
  racks, JV Case pour les flightcases. Une entreprise qui possède ses propres marques
  a une marge de manœuvre bien plus grande qu''un simple revendeur pour faire un geste
  matériel : le coût réel d''une dotation est son prix de revient, pas son prix catalogue.
  En face, ce qu''ils achètent, c''est une crédibilité dans la scène événementielle
  belge que leurs marques (positionnées prosumer) n''ont pas.'
ask:
  type:
  - material
  - loan
  - consumables
  - discount
  detail: 'Un soutien materiel sur trois postes, ENONCES EN CATEGORIES et jamais en
    marques : (1) ECLAIRAGE, le poste le moins couvert du parc et le seul que presque
    personne du fichier ne vend ; (2) CABLAGE ET CONNECTIQUE : cables HP, multipaires,
    connecteurs, panneaux ; (3) RACKS D''AMPLIS ET FLIGHTCASES uniquement, pas d''autres
    racks. En dotation, pret longue duree ou conditions preferentielles. NE PAS citer
    leurs marques maison dans l''e-mail : on sait qu''ils les possedent, c''est ce
    qui rend la demande realiste, mais leur reciter leur catalogue donne l''impression
    de choisir a leur place. NE PAS demander d''amplification : poste couvert par
    ADmark. Contrepartie : marquage sur les cases, les racks et les structures, visibilite
    sur 10-15 evenements et aupres des 27 000 abonnes.'
  realistic_value_eur: 4500
  public: "- de l'éclairage : c'est aujourd'hui le poste le moins équipé de notre\
    \ parc ;\n- du câblage et de la connectique : câbles haut-parleurs, multipaires,\
    \ connecteurs et panneaux\n  pour les racks et les façades. Nous en reprenons\
    \ à chaque série et à chaque réparation ;\n- des racks d'amplis et des flightcases.\
    \ Un système qui se déplace dix à quinze fois par an\n  s'abîme dans le camion,\
    \ pas sur scène."
