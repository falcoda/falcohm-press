why_us: 'Ce n''est ni un financeur ni un fournisseur : c''est la fédération des organisateurs
  de concerts, et son contrat-programme lui demande de « rassembler également les
  opérateurs du secteur non-professionnel qui ne bénéficient pas encore de reconnaissance
  institutionnelle ou ne disposent pas encore d''emplois ». C''est notre description
  exacte. Seize de ses membres sont des « organisations sans lieu fixe », plusieurs
  sont techno (Symbiosis, La Nature, Corps et Logis). Pour 25 EUR par an, on entre
  dans le réseau des salles (Rockerill, Vecteur, Belvédère, KulturA), on accède aux
  formations son et lumière gratuites pour les membres, aux bourses Lotto de 500 EUR
  par concert découverte, et surtout on coche « intégration dans les réseaux professionnels
  », le critère sur lequel le dossier FWB du Service des Musiques nous juge le plus
  fragile.'
ask:
  type:
  - services
  detail: 'UNE SEULE DEMANDE : l''adhésion comme « organisation de concerts sans lieu
    fixe ». Conditions (page Devenir membre) : personne morale en Wallonie ou à Bruxelles,
    au moins 12 artistes ou groupes par an, responsable de programmation désigné,
    rémunération correcte des musiciens, charte éthique ; cotisation 25 EUR minimum.
    Engagements : formulaire GIMIC, enquête annuelle, présence à un événement par
    an, encodage des dates sur court-circuit.live. Ensuite, sans rien demander de
    plus : formations du cycle 4 (second semestre 2026), bourses Lotto (septembre
    à décembre 2026), dispositif Expertises. Ne pas demander de matériel ni d''argent
    : ils n''en ont pas pour ça. Ne pas envoyer le dossier de partenariat généré,
    qui demande un « soutien institutionnel ».'
  realistic_value_eur: 2000
values:
- Professionnalisation et structuration du secteur
- Mise en réseau des lieux et organisations de concerts
- Émergence artistique en Wallonie et à Bruxelles
- Juste rémunération des artistes
- Ancrage territorial et diversité
