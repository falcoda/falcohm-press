profile:
  activity: Fédération du secteur des musiques actuelles en Fédération Wallonie-Bruxelles
    (ASBL depuis 1992, fédération professionnelle reconnue en 2020, contrat-programme
    FWB 2024-2029). Elle rassemble les lieux et les organisations de concerts, les
    représente, les professionnalise et les met en réseau. Six personnes, 67 à 76
    membres (37 lieux, 17 festivals, 16 organisations sans lieu fixe). Siège 24 avenue
    Cardinal Mercier, 5000 Namur ; antenne avenue de la Toison d'Or 72, 1060 Bruxelles.
    Elle ne finance pas d'événements.
  products:
  - Adhésion (25 EUR par an pour une structure non subventionnée), réseau, représentation,
    intranet, promotion sur court-circuit.be, .band et .live
  - Circuit Sessions, formations (technique son et lumière, premiers secours, administratif,
    communication), gratuites pour les membres sans accès aux Fonds 4S et 304
  - Dispositifs financiers réservés aux membres en 2026 (bourses Lotto de 500 EUR
    par concert découverte, Expertises, Explore)
  - Guide de l'Organisation de Concerts et ressources ASBL (gestion des bénévoles,
    obligations 2026)
  - court-circuit.live (agenda des dates) et court-circuit.band (appels à candidatures)
