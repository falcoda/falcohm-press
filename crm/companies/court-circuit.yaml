  rationale: 'Fit réel (7) : ils n''ont ni matériel ni argent pour nous, mais ils
    ont ce qui manque à une ASBL bénévole qui veut déposer un dossier FWB : formations
    son et lumière et premiers secours, guides, réseau des salles, visibilité des
    dates, et une fois membre des bourses de 500 EUR par concert découverte. Probabilité
    bonne (7) : l''adhésion est ouverte toute l''année aux opérateurs non reconnus,
    les conditions (12 artistes par an, responsable de programmation, rémunération
    des musiciens) sont remplies, et trois membres sont déjà techno ; reste l''acte
    de l''AG et la charte éthique à signer. Impact moyen mais structurant (6) : quelques
    centaines à deux mille euros par an en formations et bourses, et surtout la case
    « réseaux professionnels » du dossier du Service des Musiques, qui pèse sur un
    subside à cinq chiffres.'
