notes: 'CE N''EST PAS UN FINANCEUR. Ne rien lui demander d''autre que l''adhésion,
  puis les services réservés aux membres. Leur vocabulaire : « musiques actuelles
  », « organisation de concerts sans lieu fixe », « professionnalisation », « juste
  rémunération », « émergence ». Jamais « collectif », « scène électronique », « free
  party », « sound system » comme identité : ces mots n''existent nulle part chez
  eux.

  CONDITIONS D''ADHÉSION (page Devenir membre, formulation à revérifier sur le formulaire)
  : au moins 12 artistes ou groupes par an (6 pour un festival avec part majoritaire
  FWB), un responsable de programmation désigné, « rémunération correcte des musiciens
  », charte éthique. Cotisation « 0,10% de la subvention ordinaire FWB avec un minimum
  de 25 euros [...] et maximum de 100 euros ».

  CE QUI N''EXISTE PLUS : les Extras et les Tournées sectorielles (le contrat 2024-2029
  demande de « mettre de côté le pôle diffusion »), l''Electronic Music Program (page
  vide). Propulsion n''est pas à eux ; ProPulse (AssProPro) est seulement relayé,
  « musiques électroniques (hors DJ) ».

  ÉQUIPE : David Dehard (direction), Solène Rasquin (administration, formations),
  Martin Hellinckx (projets), Florence Delporte (communication institutionnelle, absence
  probable à l''automne 2026), Margaux Bernard (communication événementielle), Stanislas
  Levacq (membres et ressources, absent de la page Contacts au 2026-09-09). Organe
  d''administration depuis avril 2025 : Anne Harpigny (L''Entrepôt), Frédéric Maréchal
  (Botanique), Kostia Pace (Jazz Station), Phil Henrion (Atelier Rock), Pierre Mulder
  (OM), Royen Mulenga (Motown Concerts).

  NON VÉRIFIÉ : pages des trois dispositifs financiers (espace membres), programme
  du cycle 4, Fête de la FWB 2026 (24 au 27 septembre, financeur non confirmé), présence
  actuelle de Stanislas Levacq, téléphone 02/550.13.32 (CGU de court-circuit.live).'
