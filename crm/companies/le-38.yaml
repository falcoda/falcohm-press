profile:
  activity: 'Carrefour culturel de Genappe, Rue de Bruxelles 38, 1470 Genappe. Réunit
    sous un même toit le Centre culturel, la Maison des Jeunes (ancien Bug-1), les
    Ateliers du 38 (CEC) et une Fabrique de patrimoine. La Maison des Jeunes accueille
    « une quarantaine de jeunes chaque jour » (Tristan Scarnière, L''Avenir, 30/09/2026).
    Désigné par la Ville comme coordinateur de « Place aux Jeunes » (courrier E53476),
    mais n''y participe plus en 2026-2027 : le dispositif a été réorienté vers la santé
    et le bien-être des jeunes (Tristan Scarnière, 2026-10-01). Public large, pas seulement
    ado : Centre culturel, Maison de jeunes et Centre d''expression et de créativité.
    A un responsable technique (Damien Narciandi Alonso).'
  products:
  - Ancien porteur local de « Place aux Jeunes » (événement hip-hop au skatepark
    de Genappe), arrêté en 2026-2027 après la réorientation du dispositif
  - Parc technique propre géré par un responsable technique (contenu à connaître)
  - 'Événements jeunesse de la Maison des Jeunes : Genappe Zoo (« Mini festival 100%
    hip-hop »), skate contest et battle de breakdance, Passe à la Maison (portes ouvertes)'
  - AG et CA ouverts aux associations socioculturelles du territoire
  size:
    employees: ''
    revenue: ''
  identifiers:
    vat: ''
    linkedin: ''
why_us: 'C''est la Ville de Genappe qui nous y a envoyés (courrier E53476), et le
  38 a répondu le jour même en mettant son responsable technique dans la boucle pour
  « envisager un éventuel autre partenariat ». Place aux Jeunes est fermé, mais le
  38 ne vise pas que les ados : Centre culturel, Maison de jeunes et CEC organisent
  des événements qui ont besoin de son, et un centre culturel a un parc technique
  (éclairage, scène) là où le nôtre est le plus faible (data/existing-suppliers.yaml
  : l''éclairage est le poste le moins couvert). Deux voisins genappiens qui échangent
  du matériel, c''est un partenariat qui dure.'
ask:
  type:
  - services
  - financial
  detail: 'INTERNE, mis à jour le 2026-10-01 après la réponse de Tristan. Place aux
    Jeunes est hors jeu (réorienté santé et bien-être, le 38 n''y participe plus).
    Trois pistes soumises à Damien, responsable technique : (1) notre système son
    et l''équipe au service d''événements du 38 ; (2) échange de matériel entre les
    deux parcs, notre son contre leur éclairage ou leurs praticables (éclairage = poste
    le moins couvert chez nous) ; (3) une date Gazmatek dans leurs lieux, si la salle
    s''y prête (capacité, horaires, voisinage : rien de connu). Ne pas demander de subside au 38 : il est lui-même subsidié par la Ville
    (Plan de Cohésion Sociale, 1.500 EUR par an au 38 ; subside de fonctionnement
    à la Maison des Jeunes, rapport annuel 2025 de la Ville). Second temps : demander
    à siéger à leur AG comme association socioculturelle du territoire.'
  public: mettre notre système son et l'équipe qui l'exploite au service d'événements
    du 38, échanger du matériel entre nos deux parcs (éclairage, praticables), ou
    accueillir une date Gazmatek au 38
  realistic_value_eur: 0
