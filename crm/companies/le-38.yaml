  rationale: 'RÉVISÉ LE 2026-10-01 : Place aux Jeunes est fermé, mais Tristan a répondu
    le jour même et mis le responsable technique en copie pour un autre partenariat
    : probabilité 7. Le fit reste 6 (un centre culturel a des besoins de son et un
    parc d''éclairage, mais rien ne dit encore qu''il prête ou échange). Impact 4 :
    local, en nature, mais durable. ANALYSE D''ORIGINE : Le fit est réel mais indirect : la Maison des Jeunes fait des événements
    musicaux qui ont besoin d''un système son, mais pour des 10-20 ans, alors que
    Gazmatek vise les 18-34 ans. On n''y entre pas avec un événement Gazmatek, on
    y entre avec le matériel et l''équipe de Falc''ohm System. La probabilité est
    correcte : c''est la Ville qui nous y envoie par écrit, la structure est locale
    et accessible, mais l''enveloppe 2026-2027 est peut-être déjà engagée et ils ont
    leurs propres prestataires. L''impact direct est faible (1.000 à 5.000 EUR doublés,
    partagés avec les cachets), mais il compte ailleurs : un premier projet mené avec
    un opérateur reconnu de la Fédération Wallonie-Bruxelles et la Province crédibilise
    les dossiers Province et FWB, et ancre l''ASBL dans le tissu associatif genappien.'
