why_us: 'C''est LE dispositif public taillé pour ce que fait Gazmatek : l''« Aide
  aux structures de programmation » couvre explicitement l''organisation d''un festival
  de musique et d''une année/saison de concerts. Falc''ohm System coche les conditions
  de base : personne morale établie en Fédération Wallonie-Bruxelles (Genappe), aucun
  contrat-programme ni contrat de diffusion en cours, et un historique de plusieurs
  éditions, or le texte précise qu''en musiques actuelles « la priorité est accordée
  aux projets ayant déjà eu 2 éditions ou saisons précédentes ». Décisif : le Service
  des Musiques a une agente dédiée au secteur des MUSIQUES ÉLECTRONIQUES (Diane Dernouchamps).
  Le genre est donc un secteur d''instruction identifié, pas une exception à plaider.

  '
ask:
  type:
  - financial
  detail: 'DEUX VOIES DISTINCTES, verifiees sur la page officielle le 2026-09-07.
    Ne pas les confondre, les seuils n''ont rien a voir.

    (A) FESTIVAL, musiques actuelles, aide ponctuelle sur UNE EDITION : au minimum
    7 concerts DANS L''EDITION, dont au moins 1/3 d''artistes de la FWB, budget global
    >= 20 000 EUR, cachets artistiques >= 10 000 EUR.

    (B) LIEU DE DIFFUSION ET ORGANISATEUR DE CONCERTS, musiques actuelles, sur UNE
    ANNEE ou SAISON : au minimum 18 artistes ou groupes programmes, dont au moins
    1/3 de la FWB, budget global >= 20 000 EUR, cachets artistiques >= 10 000 EUR.

    ATTENTION : « 7 concerts par an » ne correspond a AUCUNE des deux voies. La voie
    A compte les concerts d''une seule edition, la voie B compte 18 artistes sur l''annee.
    Avec 6 a 10 dates organisees par an (precision de Corentin du 2026-09-09, le «
    10-15 » de data/stats.yaml compte aussi les prestations) et plusieurs artistes
    par date, la voie B (18 artistes sur une saison) reste probablement accessible,
    et un evenement a trois scenes comme Shadow satisfait sans doute la voie A a lui
    seul. A COMPTER, date par date, artiste par artiste.

    Subvention de minimum 5 000 EUR, versee en une fois sous 6 000 EUR. Pieces : formulaire
    en ligne, budget previsionnel .xls, grille de programmation .docx, comptes et
    bilan de la derniere edition.'
  realistic_value_eur: 6000
