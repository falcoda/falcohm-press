interactions:
- date: '2026-09-07'
  type: note
  resume: 'SEUIL LE PLUS DUR FRANCHI. Corentin confirme des cachets artistiques de
    20 000 a 30 000 EUR sur la derniere edition, la ou le seuil eliminatoire est de
    10 000 EUR. Le budget global de 20 000 EUR est donc egalement depasse de fait.
    Le dossier passe du statut d''hypothese a celui de cible reelle. Verifie le meme
    jour sur la page officielle : la notion d''« artiste de la FWB » n''exige AUCUNE
    inscription a un organisme. Le texte dit « promouvoir et diffuser des artistes/groupes/ensembles
    de la Federation Wallonie-Bruxelles visant a developper une carriere professionnelle
    ». Un artiste independant wallon ou bruxellois, paye pour jouer, satisfait le
    critere. L''inquietude de Corentin sur ce point n''a pas lieu d''etre.'
- date: '2026-09-07'
  type: note
  resume: 'POINT DE VIGILANCE MAJEUR souleve par Corentin : les artistes residents
    sont payes en « contrats benevoles ». Deux problemes distincts, a ne pas melanger.
    (1) POUR LE DOSSIER : le dispositif exige des CACHETS ARTISTIQUES remunerant des
    artistes « visant une carriere professionnelle ». Un defraiement de volontaire
    n''est pas un cachet artistique, et il apparait dans les comptes comme frais de
    benevolat. Les montants ainsi verses risquent de ne PAS compter dans le seuil
    des 10 000 EUR, ce qui reduirait d''autant les 20 a 30 000 EUR annonces. (2) SUR
    LE FOND, hors subside : la loi belge sur le volontariat couvre du benevolat defraye,
    pas la remuneration d''une prestation artistique reguliere. Un DJ resident paye
    ainsi de facon repetee expose l''ASBL a un risque de requalification. Ce depot
    n''est pas un avis juridique et ne doit pas etre lu comme tel. A FAIRE VERIFIER
    par une source competente AVANT le depot : c''est exactement l''objet du conseil
    individuel Musiscope, gratuit, administratif juridique et financier, demande au
    Conseil de la Musique le 2026-09-04.'
- date: '2026-09-09'
  type: note
  resume: 'RECHERCHE APPROFONDIE du 2026-09-09, a la demande de Corentin. Date 2027
    confirmee (5 fevrier). Montants 2025 aux festivals electro : Abrupt 20 000, La
    Nature 16 000, Bear Rock & Electro 10 000 EUR ; refus Hyperlien, DNB Sewers, FCKNYE
    sur rayonnement et budget, pas sur l''esthetique. Organigramme complet et cabinet
    (Alix Dehin, conseillere Musique) avec adresses prouvees. Education permanente
    : moratoire, rien avant 2028. Equipement : demarche 3935 reservee aux structurels
    et suspendue. Le Brabant wallon est la province la moins dotee du reseau pop rock
    electro. Deux questions de recevabilite a poser par ecrit a Diane Dernouchamps
    (DJ set = concert ? definition artiste FWB ?), la question du defraiement volontaire
    a Musiscope d''abord. Tout est dans knowledge/Federation Wallonie-Bruxelles.md.'
