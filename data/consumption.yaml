# Consommation boissons, la base chiffrée du dossier brasserie.
#
# POURQUOI CE FICHIER : une brasserie n'accorde pas de conditions partenaire sur un discours,
# elle les accorde sur un VOLUME. Un volume inventé se retourne au premier bon de commande.
#
# RÈGLE : aucun chiffre ici sans source. Une seule case reste vide, celle du 31/10/2025, et
# elle reste vide tant que le chiffre réel n'est pas retrouvé. Ne pas l'estimer.
#
# Chiffres communiqués par Corentin Dallenogare le 2026-09-04.
# Unité : TOUS les fûts sont des 30 L. Un fût = 30 litres, sans exception dans ce fichier.

