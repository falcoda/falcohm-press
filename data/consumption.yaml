products:
  # Répartition connue sur 203 des 268 fûts. Les 65 fûts d'Halloween 2025 ne sont pas ventilés.
  pils: { kegs: 194, litres: 5820, share_of_known_pct: 96 }
  ipa: { kegs: 5, litres: 150, share_of_known_pct: 2 }
  triple: { kegs: 4, litres: 120, share_of_known_pct: 2 }
  unspecified: { kegs: 65, litres: 1950, note: Halloween 2025, répartition non communiquée }
  note: >-
    La pils fait 96 % du volume ventilé. C'est le produit sur lequel se négocient les conditions.
    L'IPA apparaît dès mars 2025 et la triple en juin 2026 : une gamme d'abbaye a donc sa place
    à côté de la pils, mais elle reste marginale en volume.
    NE PAS écrire « 96 % du volume total » : c'est 96 % des 203 fûts ventilés, pas des 268.

