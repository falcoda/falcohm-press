totals:
  kegs_known: 268
  litres_known: 8040
  attendance_covered: 9590
  litres_per_person: 0.84          # calculé, pas saisi. Fourchette observée : 0,67 à 1,15.
  complete: true
  completed_on: '2026-09-08'
  note: >-
    RELEVÉ COMPLET depuis le 2026-09-08 : les dix sessions ont leur volume. Environ 8 000 L sur
    dix-huit mois, servis par nous sur l'ensemble des dates.
    Le ratio est stable d'une date à l'autre, ce qui rend le relevé crédible auprès d'un
    brasseur : ce n'est pas une estimation lissée, ce sont des achats réels.
    Tout est communiqué de mémoire par Corentin, sans facture à l'appui, et se dit comme tel.

