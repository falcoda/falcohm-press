# La nomenclature. Ce qu'on construit, avec quoi, en quelles quantités.
#
# POURQUOI CE FICHIER : le 2026-09-04, Audio Components (structure B2B de SoundImports) a
# répondu favorablement et a posé six questions, toutes portant sur les quantités et les
# références. Le dépôt ne pouvait répondre à aucune. Un distributeur n'accorde pas de conditions
# sur un discours, il les accorde sur un volume, exactement comme une brasserie.
#
# RÈGLE : ce qui est arrêté est marqué `confirmed: true`. Ce qui dépend du budget ou d'un modèle
# non sorti reste `confirmed: false` et se dit comme tel à un fournisseur. Un volume annoncé
# détermine les conditions accordées : le gonfler se retourne à la première commande.
#
# RAPPEL : nous FABRIQUONS d'après les plans d'un concepteur. Ces modèles ne sont pas nos
# créations et ne doivent jamais être présentés comme telles (CLAUDE.md).

meta:
  retrieved_on: '2026-09-04'
  filled_by: Corentin Dallenogare
  source: Communiqué par Corentin en réponse aux six questions d'Omar Sadek (Audio Components).
  corrected_on: '2026-09-07'

# Le concepteur dont nous suivons les plans. CLAUDE.md interdit de revendiquer la conception
# des enceintes : voici de qui elle est.
designers:
  - name: JW Sound LLC
    url: https://www.jwsound.live/
    note: >-
      Auteur des modèles JMOD. Les fiches produit sont publiques et donnent les composants et les
      cotes, ce qui autorise à les citer auprès d'un fournisseur. Vérifier la fiche du modèle avant
      d'écrire quoi que ce soit de technique : c'est elle qui fait foi, pas notre mémoire.
  - name: Marc.o
    url: ''
    note: >-
      Auteur du MTH 4654, et de lui seul (Corentin, 2026-09-11). Tous les JMOD sont de JW Sound.
      Ajouté le 2026-09-09 : Corentin l'avait écrit à Audio Components le 2026-09-07, « we build
      from JW Sound designs, and Marc.o », et le dépôt l'ignorait.

# ---------------------------------------------------------------------------
# LA RÈGLE QUI FERME LA QUESTION DES ÉQUIVALENCES
# ---------------------------------------------------------------------------
# Arbitrage de Corentin, 2026-09-09, après la proposition d'Audio Components de remplacer les
# transducteurs B&C et RCF par des équivalents de leur catalogue.
driver_substitution:
  possible: false
  note: >-
    LE TRANSDUCTEUR NE SE CHANGE PAS. Ce n'est pas un attachement de marque : le pavillon et le
    volume de charge sont dimensionnés autour du haut-parleur dans les plans, donc changer le
    transducteur revient à changer de caisson, pas de fournisseur. Toute proposition
    d'équivalence, quelle que soit la marque, se refuse sur cette base, et la raison se donne, un
    distributeur de composants la comprend immédiatement.
    ET PAS D'EXCEPTION SUR LE KICK BIN, contrairement à ce qui a été écrit ici le matin même du
    2026-09-09. Le modèle n'est pas arrêté, mais Corentin partira très probablement sur la même
    marque de transducteur que le reste du parc : un parc qui mélange les marques se maintient
    deux fois, et le stock de pièces de rechange double. Le kick bin n'est donc pas un terrain
    ouvert à offrir à un fournisseur, et le présenter comme tel se retournerait à la commande.

# ---------------------------------------------------------------------------
# 1. PREMIÈRE SÉRIE : les composants arrêtés
# ---------------------------------------------------------------------------
first_series:
  confirmed: true          # les RÉFÉRENCES sont arrêtées
  qty_confirmed: false     # les QUANTITÉS ne le sont pas, elles suivent le prix obtenu
  qty_rule: >-
    CE QUI EST PARTI CHEZ AUDIO COMPONENTS LE 2026-09-07, mot pour mot : « The references are
    fixed, they come from the plans we build from. The quantities move with the price we land on,
    so read them as approximate ». Les `qty` ci-dessous sont donc des APPROXIMATIONS et se
    réécrivent toujours avec un « environ » ou un « +/- » vers un fournisseur. Les annoncer nues
    reviendrait à s'engager sur un volume qu'on ne tiendra pas si le tarif ne suit pas.
  components:
    - brand: B&C Speakers
      ref: 12NDL88
      type: Haut-parleur médium 12 pouces
      qty: 12
    - brand: B&C Speakers
      ref: DCX464
      type: Moteur de compression coaxial
      qty: 4
    - brand: B&C Speakers
      ref: FB464
      type: >-
        Réseau de filtrage passif pour le DCX464. CE N'EST PAS UN PAVILLON, l'erreur avait été
        commise le 2026-09-07 et corrigée le jour même depuis la fiche JMOD-M de JW Sound, qui
        mentionne « bi-amp with B&C FB464 passive crossover network ». Un distributeur de
        composants repère ce genre de confusion immédiatement.
      qty: 4
    - brand: RCF
      ref: 21LF-N451
      type: Haut-parleur de grave 21 pouces
      qty: 6
  note: >-
    Deux marques seulement, B&C et RCF, ce qui simplifie la négociation : un distributeur qui
    référence les deux couvre toute la partie transducteurs.
  crossover_note: >-
    LA PARTIE FILTRE EST COUVERTE, ET SEULEMENT CELLE-LÀ. Envoyé à Audio Components le
    2026-09-07 : « On the crossover side, the FB464 above covers the coaxial section ». Autrement
    dit le seul composant de filtrage passif de la nomenclature est le FB464, et il ne concerne que
    la section coaxiale du DCX464.
    LES AUTRES MODÈLES N'ONT AUCUN FILTRE PASSIF (Corentin, 2026-09-11) : ils ne sont pas filtrés,
    ou ils le sont en actif par l'amplificateur externe ADmark, qui embarque le DSP.
    CONSÉQUENCE, et elle vaut pour toutes les cibles : « composants de filtre passif » N'EST PAS
    UN POSTE. On ne le demande à personne. Le FB464 est un accessoire B&C qui se commande avec le
    DCX464, chez le même fournisseur, pas une ligne de condensateurs et de selfs.

# ---------------------------------------------------------------------------
# 2. LES MODÈLES DE CAISSONS
# ---------------------------------------------------------------------------
# Cinq modèles. C'est la réponse à « how many different cabinet models are you planning to build ».
models:
  - name: JMOD Solana
    designer: JW Sound LLC
    status: en cours de construction
    confirmed: true
    qty_this_year: 4
    parts_bought: true
    qty_note: >-
      4 caissons, et TOUT EST DÉJÀ ACHETÉ (Corentin, 2026-09-11). Ils n'entrent donc dans aucun
      volume annoncé à un fournisseur : ce serait promettre une commande qui a déjà eu lieu
      ailleurs.
  - name: MTH 4654
    designer: Marc.o
    status: à construire, équipé en RCF
    confirmed: true
    qty_this_year: 6
    qty_note: >-
      Environ 6 unités de plus cette année, sous réserve du prix et du budget. Toujours l'écrire
      avec un « environ » ou un « plus ou moins » : la quantité dépend du tarif obtenu, et un
      chiffre net serait pris pour un engagement.
  - name: JMOD 2.0
    designer: JW Sound LLC
    status: à construire
    confirmed: true
    qty_this_year: 4
    qty_firm: true
    qty_note: >-
      2 paires cette année, soit 4 caissons. LE SEUL VOLUME FERME DE TOUT LE DOSSIER : envoyé à
      Audio Components le 2026-09-07 sous « Firm for this year », par opposition aux MTH 4654 qui
      sont conditionnés au prix. C'est donc le seul chiffre qu'on peut poser nu devant un
      fournisseur.
  - name: JMOD-M Arrayed Multiple Entry Horn
    display: JMOD-M
    designer: JW Sound LLC
    type: >-
      Point source arrayable, multiple entry horn. CE N'EST PAS UN LINE ARRAY : la formulation
      était fausse dans le premier brouillon du 2026-09-07. Directivité constante 110 x 55 degrés,
      2 x 12 pouces ou 2 x 14 pouces de médium-grave plus un moteur de compression coaxial.
    status: Under Development/Rework, selon la fiche publique de JW Sound
    url: https://www.jwsound.live/designs/jmodm-medium-format-array
    confirmed: false
    qty_next_year: 6
    qty_note: Environ 3 paires l'an prochain, à la sortie du modèle.
    naming_rule: >-
      LE NOMMER EST SANS RISQUE : le modèle est publiquement documenté par son concepteur, avec
      ses cotes et ses composants. Ce qui reste incertain n'est pas le nom mais la DISPONIBILITÉ,
      la fiche portant la mention « Under Development/Rework ». On peut donc le citer, à condition
      de ne s'engager sur aucune date : le calendrier appartient à JW Sound, pas à nous.
  - name: Kick bin
    designer: ''
    status: reporté, « pas pour tout de suite » (Corentin, 2026-09-11), aucune date
    confirmed: false
    qty_note: Modèle non arrêté. Aucune quantité annonçable.
    driver_note: >-
      2026-09-09 : le modèle n'est pas choisi, mais le transducteur le sera très probablement dans
      la même marque que le reste du parc. Ne plus le présenter à un fournisseur comme un poste
      ouvert à sa gamme, l'erreur a été commise dans un brouillon le 2026-09-09 et corrigée avant
      envoi.

# ---------------------------------------------------------------------------
# 2 BIS. CE QUE CONSOMME UN CAISSON
# ---------------------------------------------------------------------------
# Donné par Corentin le 2026-09-11. C'est ce qu'un fournisseur de quincaillerie, de bois ou de
# visserie demande en premier, et c'est ce qui manquait pour répondre à Audio Components.
per_cabinet:
  source: Corentin Dallenogare, 2026-09-11
  scope: >-
    MOYENNE PAR CAISSON, TOUS MODÈLES CONFONDUS. Un MTH 4654 et un JMOD 2.0 n'ont pas la même
    taille : le bois et la peinture varient d'un modèle à l'autre, la quincaillerie beaucoup
    moins. Les postes marqués `approx` s'écrivent avec un « environ » vers un fournisseur ; les
    autres sont fixés par le plan (un caisson a huit coins, pas « environ huit »).
  items:
    - { item: Coins, qty: 8 }
    - { item: Connecteurs Speakon, qty: 2, type: châssis femelle 4 pôles }
    - { item: Poignées, qty: 4 }
    - { item: Bornier, qty: 1 }
    - { item: Câble haut-parleur interne, qty: 3, unit: m, approx: true }
    - { item: Vis, qty: 200, approx: true }
    - { item: Peinture Warnex, qty: 2, unit: L, approx: true }
    - { item: Contreplaqué bouleau, qty: '1 à 2', unit: planches, approx: true }
  no_gaskets: >-
    PAS DE JOINTS NI D'AMORTISSANT (Corentin, 2026-09-11). Ils figuraient dans la liste envoyée à
    Audio Components le 2026-09-09 : les retirer de toute demande.
  paint_note: >-
    WARNEX, confirmé par Corentin le 2026-09-11 : c'est le produit, pas une préférence. Dans une
    liste de catégories de premier contact, on écrit « peinture de protection » (CLAUDE.md) ; dès
    qu'un fournisseur demande la référence ou propose autre chose, la réponse est Warnex.
  plywood_note: >-
    Le format et l'épaisseur des planches ne sont pas renseignés. Sans eux, un marchand de bois ne
    peut pas chiffrer : « une ou deux planches » n'est pas une quantité pour lui.

# Articles proposés par Audio Components (SoundImports) le 2026-09-15, en réponse aux quantités par
# caisson. Prix publics promotionnels lus sur soundimports.eu le même jour, pas les conditions B2B : ils
# servent à mesurer l'enjeu, pas à négocier. Tous affichés « Pre-order », à confirmer avec Omar.
supplier_articles:
  supplier: SoundImports B.V. (Audio Components, Omar Sadek)
  proposed_on: '2026-09-15'
  items:
    - { item: Connecteur Speakon châssis 4 pôles, ref: '1649', price_eur: 2.47, per_cabinet: 2, status: accepté }
    - { item: Bornier, ref: 260-110, name: 'Blank Terminal Cup 132 x 183 mm', price_eur: 5.17, per_cabinet: 1, status: accepté }
    - { item: Coins, ref: MZF-8508, name: 'Monacor MZF-8508 Metal Corner, Large', price_eur: 0.74, per_cabinet: 8, status: 'dimensions demandées' }
    - { item: Poignées, ref: 262-821, name: 'Steel Bar Speaker Cabinet Handle 162 x 220 x 60', price_eur: 9.46, per_cabinet: 4, status: accepté }
    - { item: Câble interne, ref: SI-WIRE-4.0mm2, name: 'câble 2 x 4,0 mm² OFC, au mètre', price_eur: 3.30, per_cabinet: 3, status: 'accepté, à vérifier contre les plans' }
    - { item: Vis, ref: 081-1100, name: 'Coarse Thread Cabinet Screw 3,3 x 25,4 mm', price_eur: 0.15, per_cabinet: 200, status: 'tailles à relever sur les plans' }
  per_cabinet_eur: 'environ 94, au prix public promotionnel'
  note: >-
    Environ 94 EUR de quincaillerie par caisson au prix public, donc environ 375 EUR sur les 4 caissons fermes et
    environ 1 500 EUR sur une quinzaine en deux ans. La visserie en fait près d'un tiers : c'est le poste à vérifier
    en premier, une seule taille de 25 mm ne suffit sans doute pas à assembler des panneaux de contreplaqué.

# Les volumes qui en découlent. DÉRIVÉS de per_cabinet et de models : à recalculer si l'un change.
# Deux colonnes, parce qu'il n'y a qu'un seul volume ferme dans le dossier.
totals:
  computed_on: '2026-09-11'
  cabinets:
    firm: 4            # 4 JMOD 2.0, « Firm for this year »
    two_years: 16      # les 4 fermes + environ 6 MTH 4654 (selon le prix) + environ 6 JMOD-M
    excluded: >-
      JMOD Solana (4 caissons, tout est déjà acheté) et kick bin (reporté).
    history: >-
      Le volume ferme est passé à 8 dans la matinée du 2026-09-11 en comptant les Solana, puis est
      revenu à 4 le même jour, quand Corentin a précisé que leur quincaillerie était déjà achetée.
      C'est le chiffre envoyé à Audio Components le 2026-09-07 : rien à corriger chez eux.
  items:
    - { item: Coins, firm: '32', two_years: 'environ 128' }
    - { item: Poignées, firm: '16', two_years: 'environ 64' }
    - { item: Connecteurs Speakon, firm: '8', two_years: 'environ 32' }
    - { item: Borniers, firm: '4', two_years: 'environ 16' }
    - { item: Câble haut-parleur interne, firm: 'environ 12 m', two_years: 'environ 48 m' }
    - { item: Vis, firm: 'environ 800', two_years: 'environ 3 200' }
    - { item: Peinture Warnex, firm: 'environ 8 L', two_years: 'environ 32 L' }
    - { item: Contreplaqué bouleau, firm: '4 à 8 planches', two_years: 'environ 16 à 32 planches' }
  rule: >-
    Vers un fournisseur, la colonne `firm` peut se poser telle quelle, la colonne `two_years` ne
    s'écrit JAMAIS sans son « environ » : elle dépend du prix obtenu sur les MTH 4654 et de la
    sortie du JMOD-M, qui appartient à JW Sound.

# ---------------------------------------------------------------------------
# 3. AUTRES POSTES
# ---------------------------------------------------------------------------
other_needs:
  - post: Mesure
    have: Microphones de mesure, et versions gratuites des logiciels.
    need: >-
      Des microphones de mesure de qualité professionnelle, deux ou trois au maximum (Corentin,
      2026-09-11), et une licence Smaart.
    note: >-
      RÉPONSE D'AUDIO COMPONENTS LE 2026-09-08 : les deux moitiés du poste sont tranchées.
      MICROPHONE, c'est chez eux : ils recommandent le miniDSP UMIK-2, calibré individuellement,
      32 bits / 192 kHz, « the strongest professional measurement microphone we currently have in
      our assortment ». C'est la seule ligne de notre nomenclature que leur catalogue couvre
      pleinement aujourd'hui, donc celle qui ouvre le compte.
      SMAART, ce n'est pas chez eux : « We do not currently offer Smaart licences in our
      assortment ». La licence est éditée par Rational Acoustics et se vend par revendeurs agréés,
      c'est donc une cible à part entière, à créer. Une licence logicielle est typiquement la
      dotation qu'un éditeur accorde volontiers à une association qui publie ses mesures.
  - post: Câblage interne des caissons
    need: Câble haut-parleur interne, connectique, bornes.
    note: Traité avec Audio Components, Amptec (confection) et Beglec.
  - post: Finition et quincaillerie de caisson
    need: >-
      Connectique Speakon et les panneaux qui la reçoivent, peinture ou revêtement de protection
      des caisses, coins, poignées, visserie de montage.
    note: >-
      Poste dit par Corentin le 2026-09-09, le dépôt ne le connaissait pas. Il se répète sur CHAQUE
      caisson, donc il se multiplie par une quinzaine de caissons sur deux ans : c'est ce qui en
      fait autre chose qu'une petite commande. Demandé à Audio Components en catégories, à eux de dire ce
      qu'ils portent. Les coins, poignées et visserie se vendent aussi chez Penn Elcom et Adam Hall.
    qty: Voir per_cabinet et totals, renseignés le 2026-09-11.

  - post: Flightcases et racks
    need: >-
      3 grosses malles de transport, et 3 racks 19 pouces de 2 U pour les amplificateurs ADmark
      (Corentin, 2026-09-11). Achat ponctuel, pas un consommable.
    note: >-
      PAS chez un distributeur de composants de haut-parleurs. Cibles existantes : Penn Elcom, Adam
      Hall, JV Case chez Beglec. Un système se casse dans le camion, pas sur scène
      (data/existing-suppliers.yaml).
    note_beglec: >-
      Beglec, qui portait JV Case, a refusé le 2026-09-10 : il protège ses clients loueurs. Penn
      Elcom et Adam Hall vendent eux aussi à des loueurs, la même objection est à anticiper.

  - post: Visserie et boulonnerie
    need: Vis, boulons, quincaillerie de montage et de poignées.
    note: >-
      Module visserie, cible Würth. Environ 200 vis par caisson, soit environ 800 sur le volume
      ferme et environ 3 200 sur deux ans (totals).
  - post: Bois et panneaux
    need: Multiplex bouleau pour les caissons.
    note: >-
      Campagne bois du 2026-08-23. Une à deux planches par caisson, soit 4 à 8 planches sur le
      volume ferme et environ 16 à 32 sur deux ans (totals). Format et épaisseur manquent encore.

