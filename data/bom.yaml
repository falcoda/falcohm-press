# La nomenclature. Ce qu'on construit, avec quoi, en quelles quantités.
#
# POURQUOI CE FICHIER : le 2026-09-04, Audio Components (structure B2B de SoundImports) a
# répondu favorablement et a posé six questions, toutes portant sur les quantités et les
# références. Le dépôt ne pouvait répondre à aucune. Un distributeur n'accorde pas de conditions
# sur un discours, il les accorde sur un volume, exactement comme une brasserie.
#
# RÈGLE : ce qui est arrêté est marqué `confirmed: true`. Ce qui dépend du budget ou d'un modèle
# non sorti reste `confirmed: false` et se dit comme tel à un fournisseur. Un volume annoncé
# détermine les conditions accordées : le gonfler se retourne à la première commande.
#
# RAPPEL : nous FABRIQUONS d'après les plans d'un concepteur. Ces modèles ne sont pas nos
# créations et ne doivent jamais être présentés comme telles (CLAUDE.md).

meta:
  retrieved_on: '2026-09-04'
  filled_by: Corentin Dallenogare
  source: Communiqué par Corentin en réponse aux six questions d'Omar Sadek (Audio Components).
  corrected_on: '2026-09-07'

# Le concepteur dont nous suivons les plans. CLAUDE.md interdit de revendiquer la conception
# des enceintes : voici de qui elle est.
designers:
  - name: JW Sound LLC
    url: https://www.jwsound.live/
    note: >-
      Auteur des modèles JMOD. Les fiches produit sont publiques et donnent les composants et les
      cotes, ce qui autorise à les citer auprès d'un fournisseur. Vérifier la fiche du modèle avant
      d'écrire quoi que ce soit de technique : c'est elle qui fait foi, pas notre mémoire.
  - name: Marc.o
    url: ''
    note: >-
      SECOND CONCEPTEUR, ajouté le 2026-09-09. Corentin l'a écrit à Audio Components le 2026-09-07,
      « we build from JW Sound designs, and Marc.o », et le dépôt l'ignorait. Quel modèle vient de
      qui n'est pas établi ici : ne rien attribuer tant que ce n'est pas vérifié, un fournisseur
      qui reçoit une attribution fausse cesse de croire le reste.

# ---------------------------------------------------------------------------
# LA RÈGLE QUI FERME LA QUESTION DES ÉQUIVALENCES
# ---------------------------------------------------------------------------
# Arbitrage de Corentin, 2026-09-09, après la proposition d'Audio Components de remplacer les
# transducteurs B&C et RCF par des équivalents de leur catalogue.
driver_substitution:
  possible: false
  note: >-
    LE TRANSDUCTEUR NE SE CHANGE PAS. Ce n'est pas un attachement de marque : le pavillon et le
    volume de charge sont dimensionnés autour du haut-parleur dans les plans, donc changer le
    transducteur revient à changer de caisson, pas de fournisseur. Toute proposition
    d'équivalence, quelle que soit la marque, se refuse sur cette base, et la raison se donne, un
    distributeur de composants la comprend immédiatement.
    ET PAS D'EXCEPTION SUR LE KICK BIN, contrairement à ce qui a été écrit ici le matin même du
    2026-09-09. Le modèle n'est pas arrêté, mais Corentin partira très probablement sur la même
    marque de transducteur que le reste du parc : un parc qui mélange les marques se maintient
    deux fois, et le stock de pièces de rechange double. Le kick bin n'est donc pas un terrain
    ouvert à offrir à un fournisseur, et le présenter comme tel se retournerait à la commande.

# ---------------------------------------------------------------------------
# 1. PREMIÈRE SÉRIE : les composants arrêtés
# ---------------------------------------------------------------------------
first_series:
  confirmed: true
  components:
    - brand: B&C Speakers
      ref: 12NDL88
      type: Haut-parleur médium 12 pouces
      qty: 12
    - brand: B&C Speakers
      ref: DCX464
      type: Moteur de compression coaxial
      qty: 4
    - brand: B&C Speakers
      ref: FB464
      type: >-
        Réseau de filtrage passif pour le DCX464. CE N'EST PAS UN PAVILLON, l'erreur avait été
        commise le 2026-09-07 et corrigée le jour même depuis la fiche JMOD-M de JW Sound, qui
        mentionne « bi-amp with B&C FB464 passive crossover network ». Un distributeur de
        composants repère ce genre de confusion immédiatement.
      qty: 4
    - brand: RCF
      ref: 21LF-N451
      type: Haut-parleur de grave 21 pouces
      qty: 6
  note: >-
    Deux marques seulement, B&C et RCF, ce qui simplifie la négociation : un distributeur qui
    référence les deux couvre toute la partie transducteurs.

# ---------------------------------------------------------------------------
# 2. LES MODÈLES DE CAISSONS
# ---------------------------------------------------------------------------
# Cinq modèles. C'est la réponse à « how many different cabinet models are you planning to build ».
models:
  - name: JMOD Solana
    status: en cours de construction
    confirmed: true
  - name: MTH 4654
    status: à construire, équipé en RCF
    confirmed: true
    qty_this_year: 6
    qty_note: >-
      Environ 6 unités de plus cette année, sous réserve du prix et du budget. Toujours l'écrire
      avec un « environ » ou un « plus ou moins » : la quantité dépend du tarif obtenu, et un
      chiffre net serait pris pour un engagement.
  - name: JMOD 2.0
    status: à construire
    confirmed: true
    qty_this_year: 4
    qty_note: 2 paires cette année.
  - name: JMOD-M Arrayed Multiple Entry Horn
    display: JMOD-M
    type: >-
      Point source arrayable, multiple entry horn. CE N'EST PAS UN LINE ARRAY : la formulation
      était fausse dans le premier brouillon du 2026-09-07. Directivité constante 110 x 55 degrés,
      2 x 12 pouces ou 2 x 14 pouces de médium-grave plus un moteur de compression coaxial.
    status: Under Development/Rework, selon la fiche publique de JW Sound
    url: https://www.jwsound.live/designs/jmodm-medium-format-array
    confirmed: false
    qty_next_year: 6
    qty_note: Environ 3 paires l'an prochain, à la sortie du modèle.
    naming_rule: >-
      LE NOMMER EST SANS RISQUE : le modèle est publiquement documenté par son concepteur, avec
      ses cotes et ses composants. Ce qui reste incertain n'est pas le nom mais la DISPONIBILITÉ,
      la fiche portant la mention « Under Development/Rework ». On peut donc le citer, à condition
      de ne s'engager sur aucune date : le calendrier appartient à JW Sound, pas à nous.
  - name: Kick bin
    status: à définir
    confirmed: false
    qty_note: Modèle non arrêté. Aucune quantité annonçable.
    driver_note: >-
      2026-09-09 : le modèle n'est pas choisi, mais le transducteur le sera très probablement dans
      la même marque que le reste du parc. Ne plus le présenter à un fournisseur comme un poste
      ouvert à sa gamme, l'erreur a été commise dans un brouillon le 2026-09-09 et corrigée avant
      envoi.

# ---------------------------------------------------------------------------
# 3. AUTRES POSTES
# ---------------------------------------------------------------------------
other_needs:
  - post: Mesure
    have: Microphones de mesure, et versions gratuites des logiciels.
    need: Un microphone de mesure de qualité professionnelle, et une licence Smaart.
    note: >-
      RÉPONSE D'AUDIO COMPONENTS LE 2026-09-08 : les deux moitiés du poste sont tranchées.
      MICROPHONE, c'est chez eux : ils recommandent le miniDSP UMIK-2, calibré individuellement,
      32 bits / 192 kHz, « the strongest professional measurement microphone we currently have in
      our assortment ». C'est la seule ligne de notre nomenclature que leur catalogue couvre
      pleinement aujourd'hui, donc celle qui ouvre le compte.
      SMAART, ce n'est pas chez eux : « We do not currently offer Smaart licences in our
      assortment ». La licence est éditée par Rational Acoustics et se vend par revendeurs agréés,
      c'est donc une cible à part entière, à créer. Une licence logicielle est typiquement la
      dotation qu'un éditeur accorde volontiers à une association qui publie ses mesures.
  - post: Câblage interne des caissons
    need: Câble haut-parleur interne, connectique, bornes.
    note: Traité avec Audio Components, Amptec (confection) et Beglec.
  - post: Finition et quincaillerie de caisson
    need: >-
      Connectique Speakon et les panneaux qui la reçoivent, peinture ou revêtement de protection
      des caisses, coins, poignées, visserie de montage.
    note: >-
      Poste dit par Corentin le 2026-09-09, le dépôt ne le connaissait pas. Il se répète sur CHAQUE
      caisson, donc il se multiplie par seize caissons sur deux ans : c'est ce qui en fait autre
      chose qu'une petite commande. Demandé à Audio Components en catégories, à eux de dire ce
      qu'ils portent. Les coins, poignées et visserie se vendent aussi chez Penn Elcom et Adam Hall.
    todo: Quantités par caisson, aucune n'est établie.

  - post: Flightcases et roulage
    need: Caisses de transport pour le parc.
    note: >-
      Poste dit par Corentin le 2026-09-09. PAS chez un distributeur de composants de haut-parleurs.
      Cibles existantes : Penn Elcom, Adam Hall, JV Case chez Beglec. Un système se casse dans le
      camion, pas sur scène (data/existing-suppliers.yaml).
    todo: Combien de caisses, pour quels caissons.

  - post: Visserie et boulonnerie
    need: Vis, boulons, quincaillerie de montage et de poignées.
    note: Module visserie, cible Würth. Aucune quantité chiffrée à ce jour.
  - post: Bois et panneaux
    need: Multiplex bouleau pour les caissons.
    note: Campagne bois du 2026-08-23. Aucun tonnage chiffré à ce jour, à faire.

